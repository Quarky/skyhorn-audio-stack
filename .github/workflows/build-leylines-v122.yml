name: Build Leylines Audio Director v1.2.2

on:
  push:
    branches:
      - leylines-audio-v1.2.2-build
    paths:
      - build_leylines_v122.py
      - .github/workflows/build-leylines-v122.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Install MP3 validation tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify runner tooling
        run: |
          python3 --version
          node --version
          ffprobe -version | head -1
          unzip -v | head -1
          gh --version | head -1

      - name: Build and validate complete Foundry package
        run: python3 build_leylines_v122.py

      - name: Installer fresh and upgrade regression
        run: |
          set -euo pipefail
          PKG="$PWD/build/Ravnica_Leylines_Audio_Director_v1.2.2"
          FRESH="$RUNNER_TEMP/leylines-fresh/Data"
          UPGRADE="$RUNNER_TEMP/leylines-upgrade/Data"

          mkdir -p "$FRESH"
          FOUNDRY_V14_DATA_DIR="$FRESH" bash "$PKG/install.sh"
          test -f "$FRESH/modules/ravnica-leylines-audio-director/module.json"
          python3 - "$FRESH/modules/ravnica-leylines-audio-director/module.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["version"]=="1.2.2"
          PY

          mkdir -p "$UPGRADE/modules/ravnica-leylines-audio-director"
          printf '{"id":"ravnica-leylines-audio-director","version":"1.2.1"}\n' > "$UPGRADE/modules/ravnica-leylines-audio-director/module.json"
          echo "old-install-marker" > "$UPGRADE/modules/ravnica-leylines-audio-director/OLD_MARKER.txt"
          FOUNDRY_V14_DATA_DIR="$UPGRADE" bash "$PKG/install.sh"
          test -f "$UPGRADE/modules/ravnica-leylines-audio-director/module.json"
          python3 - "$UPGRADE/modules/ravnica-leylines-audio-director/module.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["version"]=="1.2.2"
          PY
          BACKUP="$(find "$UPGRADE/module-backups" -maxdepth 1 -type d -name 'ravnica-leylines-audio-director_*' | head -1)"
          test -n "$BACKUP"
          test -f "$BACKUP/OLD_MARKER.txt"
          test ! -f "$UPGRADE/modules/ravnica-leylines-audio-director/OLD_MARKER.txt"

      - name: Verify output
        run: |
          unzip -t dist/Ravnica_Leylines_Audio_Director_v1.2.2_FoundryV14.zip
          cat dist/Leylines_Audio_Director_v1.2.2_QA.txt
          cat dist/Ravnica_Leylines_Audio_Director_v1.2.2_SHA256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ravnica_Leylines_Audio_Director_v1.2.2
          path: |
            dist/Ravnica_Leylines_Audio_Director_v1.2.2_FoundryV14.zip
            dist/Leylines_Audio_Director_v1.2.2_QA.txt
            dist/Ravnica_Leylines_Audio_Director_v1.2.2_SHA256.txt
            dist/RELEASE_NOTES.md
            dist/MTGFoundry_Audio_Library_Current_v4.json
          if-no-files-found: error
          compression-level: 0

      - name: Publish or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="leylines-audio-v1.2.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Ravnica_Leylines_Audio_Director_v1.2.2_FoundryV14.zip dist/Leylines_Audio_Director_v1.2.2_QA.txt dist/Ravnica_Leylines_Audio_Director_v1.2.2_SHA256.txt dist/MTGFoundry_Audio_Library_Current_v4.json --clobber
          else
            gh release create "$TAG" dist/Ravnica_Leylines_Audio_Director_v1.2.2_FoundryV14.zip dist/Leylines_Audio_Director_v1.2.2_QA.txt dist/Ravnica_Leylines_Audio_Director_v1.2.2_SHA256.txt dist/MTGFoundry_Audio_Library_Current_v4.json --target "$GITHUB_SHA" --title "Ravnica Leylines Audio Director v1.2.2" --notes-file dist/RELEASE_NOTES.md
          fi
